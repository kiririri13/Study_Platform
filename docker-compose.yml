services:
  postgres:
    image: postgres:16-alpine
    container_name: study-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_platform
      POSTGRES_USER: study_platform
      POSTGRES_PASSWORD: study_platform
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_platform -d study_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
