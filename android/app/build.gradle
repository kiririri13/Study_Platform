plugins {
    id "com.android.application"
}

android {
    namespace "com.studyplatform.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.studyplatform.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "WEB_APP_URL", "\"${project.findProperty("WEB_APP_URL") ?: "http://10.0.2.2:5173"}\""
    }
}
